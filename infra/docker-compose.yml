version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: storeprint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-storeprint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-storeprint_pass}
      POSTGRES_DB: ${DB_NAME:-storeprint}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - storeprint_net

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: storeprint_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - storeprint_net

  # ─── MinIO (S3-compatible file storage) ───────────────────────
  minio:
    image: minio/minio:latest
    container_name: storeprint_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-storeprint_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-storeprint_minio_pass}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    networks:
      - storeprint_net

  # ─── Meilisearch (full-text search) ───────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: storeprint_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_key_change_me}
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - storeprint_net

  # ─── Keycloak (SSO / SAML / OAuth2) ──────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: storeprint_keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin_pass}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-storeprint}
      KC_DB_USERNAME: ${DB_USER:-storeprint}
      KC_DB_PASSWORD: ${DB_PASSWORD:-storeprint_pass}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - storeprint_net

  # ─── Ntfy (push notifications) ────────────────────────────────
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: storeprint_ntfy
    restart: unless-stopped
    command: serve
    volumes:
      - ntfy_data:/var/lib/ntfy
    ports:
      - "8088:80"
    networks:
      - storeprint_net

  # ─── API (Node.js) ────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: storeprint_api
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - minio
      - meilisearch
    networks:
      - storeprint_net

  # ─── Nginx (reverse proxy) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: storeprint_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - storeprint_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:
  ntfy_data:

networks:
  storeprint_net:
    driver: bridge
